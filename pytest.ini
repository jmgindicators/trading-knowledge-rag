[pytest]
# Add project root to PYTHONPATH so tests can `import rag`, `import ingest`
pythonpath = .

# Discover tests only inside the tests/ directory
testpaths = tests

# Test file naming convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra summary info (verbose-ish but readable)
addopts = -v --tb=short --color=yes
