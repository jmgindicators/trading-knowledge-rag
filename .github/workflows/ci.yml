# ============================================================
# CI workflow - Trading Knowledge RAG
# ============================================================
# Runs the pytest suite on every push and pull request to main,
# across three supported Python versions.
#
# Tests use mocked external dependencies (no Anthropic API key,
# no ChromaDB persistence, no real embedding model downloads),
# so the workflow is fast, free, and deterministic.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v
